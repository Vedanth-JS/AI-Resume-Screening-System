# ─── AI ATS Enterprise — Production Docker Compose v3 ────────────────────────
# Services: API (x2), Worker, Celery Beat, Flower, Nginx, Frontend, DB, Redis, ChromaDB

services:
  # ═══════════════════════════════════════════════════════════════════════════
  # API Service (FastAPI Cluster)
  # ═══════════════════════════════════════════════════════════════════════════
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ghcr.io/vedanth-js/ai-ats-api:${IMAGE_TAG:-latest}
    command: >
      sh -c "python init_db.py && uvicorn app.main:app --host 0.0.0.0 --port 8080 --workers 4"
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    env_file: .env
    environment:
      PYTHONUNBUFFERED: 1
      APP_ENV: production
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ats_network

  # ═══════════════════════════════════════════════════════════════════════════
  # Frontend (React SPA served by Nginx)
  # ═══════════════════════════════════════════════════════════════════════════
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    image: ghcr.io/vedanth-js/ai-ats-frontend:${IMAGE_TAG:-latest}
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - ats_network

  # ═══════════════════════════════════════════════════════════════════════════
  # Worker Service (Celery — Async AI Processing)
  # ═══════════════════════════════════════════════════════════════════════════
  worker:
    build: ./backend
    command: celery -A app.workers.celery_app worker --loglevel=info -Q screening,notifications,analytics --concurrency=2
    env_file: .env
    environment:
      PYTHONUNBUFFERED: 1
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping -d celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ats_network

  # ═══════════════════════════════════════════════════════════════════════════
  # Scheduler (Celery Beat)
  # ═══════════════════════════════════════════════════════════════════════════
  beat:
    build: ./backend
    command: celery -A app.workers.celery_app beat --loglevel=info
    restart: always
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - ats_network

  # ═══════════════════════════════════════════════════════════════════════════
  # Monitoring Dashboard (Flower)
  # ═══════════════════════════════════════════════════════════════════════════
  flower:
    image: mher/flower:latest
    command: celery --broker=redis://redis:6379/0 flower --basic_auth=${FLOWER_BASIC_AUTH:-admin:password}
    ports:
      - "5555:5555"
    restart: always
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - ats_network

  # ═══════════════════════════════════════════════════════════════════════════
  # Reverse Proxy (Nginx)
  # ═══════════════════════════════════════════════════════════════════════════
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    restart: always
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      api:
        condition: service_started
      frontend:
        condition: service_started
    networks:
      - ats_network

  # ═══════════════════════════════════════════════════════════════════════════
  # Database (PostgreSQL + pgvector)
  # ═══════════════════════════════════════════════════════════════════════════
  db:
    image: ankane/pgvector:v0.5.1
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pass}
      POSTGRES_DB: ${POSTGRES_DB:-resume_db}
    command: >
      postgres
      -c shared_preload_libraries=pg_stat_statements,vector
      -c pg_stat_statements.track=all
      -c max_connections=100
      -c shared_buffers=256MB
      -c effective_cache_size=768MB
      -c work_mem=16MB
      -c maintenance_work_mem=128MB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-resume_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ats_network

  # ═══════════════════════════════════════════════════════════════════════════
  # Cache (Redis)
  # ═══════════════════════════════════════════════════════════════════════════
  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --save 60 1
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - ats_network

  # ═══════════════════════════════════════════════════════════════════════════
  # Vector Store (ChromaDB)
  # ═══════════════════════════════════════════════════════════════════════════
  chromadb:
    image: chromadb/chroma:latest
    volumes:
      - chromadb_data:/chroma/chroma
    restart: always
    environment:
      - ALLOW_RESET=FALSE
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    deploy:
      resources:
        limits:
          memory: 1G
    networks:
      - ats_network

networks:
  ats_network:
    driver: bridge

volumes:
  postgres_data:
  chromadb_data:
  redis_data:
