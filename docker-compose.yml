services:
  # ─── API Service (FastAPI Cluster) ───────────────────────────────────────────
  api:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    image: ghcr.io/vedanth-js/ai-ats-api:latest
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '0.5'
          memory: 2G
      restart_policy:
        condition: on-failure
    env_file: .env
    environment:
      PYTHONUNBUFFERED: 1
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      chromadb:
        condition: service_started
      db_init:
        condition: service_completed_successfully
    networks:
      - ats_network

  # ─── Database Initialization (One-time) ────────────────────────────────────
  db_init:
    build: ./backend
    command: python init_db.py
    env_file: .env
    environment:
      PYTHONUNBUFFERED: 1
    deploy:
      resources:
        limits:
          memory: 2G
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ats_network

  # ─── Worker Service (High-Memory for AI) ─────────────────────────────────────
  worker:
    build: ./backend
    command: celery -A app.workers.celery_app worker --loglevel=info -Q screening,notifications,analytics
    env_file: .env
    environment:
      PYTHONUNBUFFERED: 1
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      chromadb:
        condition: service_started
      db_init:
        condition: service_completed_successfully
    networks:
      - ats_network

  # ─── Scheduler Service (Celery Beat) ───────────────────────────────────────
  beat:
    build: ./backend
    command: celery -A app.workers.celery_app beat --loglevel=info
    restart: always
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - ats_network

  # ─── Monitoring (Flower) ────────────────────────────────────────────────────
  flower:
    image: mher/flower:latest
    command: celery --broker=redis://redis:6379/0 flower
    ports:
      - "5555:5555"
    restart: always
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - ats_network

  # ─── Internal Dashboard (Streamlit) ────────────────────────────────────────
  dashboard:
    build: ./backend
    command: streamlit run frontend/dashboard.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    env_file: .env
    restart: on-failure
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - ats_network

  # ─── Vector Store (ChromaDB) ────────────────────────────────────────────────
  chromadb:
    image: chromadb/chroma:latest
    volumes:
      - chromadb_data:/chroma/chroma
    restart: always
    environment:
      - ALLOW_RESET=TRUE
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    deploy:
      resources:
        limits:
          memory: 1G
    networks:
      - ats_network

  # ─── Reverse Proxy (Nginx) ──────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    restart: always
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      api:
        condition: service_started
    networks:
      - ats_network

  # ─── Database (PostgreSQL) ──────────────────────────────────────────────────
  db:
    image: ankane/pgvector:v0.5.1
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pass}
      POSTGRES_DB: ${POSTGRES_DB:-resume_db}
    command: >
      postgres 
      -c shared_preload_libraries=pg_stat_statements
      -c pg_stat_statements.track=all
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d resume_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ats_network

  # ─── Cache (Redis) ──────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - ats_network

networks:
  ats_network:
    driver: bridge

volumes:
  postgres_data:
  chromadb_data:
