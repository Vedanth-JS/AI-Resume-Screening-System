# ─── AI ATS Helm Values — Production Configuration ───────────────────────────

replicaCount: 3

image:
  repository: ghcr.io/vedanth-js/ai-ats-api
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  fsGroup: 1000

securityContext:
  capabilities:
    drop: [ALL]
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 1000

service:
  type: ClusterIP
  port: 8000
  targetPort: 8000

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/rate-limit: "30"
  hosts:
    - host: api.ai-ats.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: ai-ats-tls
      hosts: [api.ai-ats.com]

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

resources:
  limits:
    cpu: 1000m
    memory: 2Gi
  requests:
    cpu: 500m
    memory: 1Gi

nodeSelector: {}
tolerations: []
affinity: {}

# ─── Application Config ───────────────────────────────────────────────────────
config:
  secretKey: "CHANGE_ME_IN_PRODUCTION"
  algorithm: "HS256"
  accessTokenExpireMinutes: 60
  refreshTokenExpireDays: 7
  appEnv: "production"
  logLevel: "INFO"
  corsOrigins:
    - "https://ai-ats.com"
    - "https://app.ai-ats.com"

# ─── Database ─────────────────────────────────────────────────────────────────
postgresql:
  enabled: true
  image: ankane/pgvector:v0.5.1
  auth:
    username: user
    password: "CHANGE_ME_DB_PASSWORD"
    database: resume_db
  primary:
    persistence:
      size: 20Gi
    resources:
      limits:
        cpu: 1000m
        memory: 2Gi
      requests:
        cpu: 500m
        memory: 1Gi

# ─── Redis ────────────────────────────────────────────────────────────────────
redis:
  enabled: true
  architecture: standalone
  auth:
    enabled: false
  master:
    persistence:
      size: 8Gi

# ─── Celery Worker ────────────────────────────────────────────────────────────
worker:
  enabled: true
  replicaCount: 2
  resources:
    limits:
      cpu: 1000m
      memory: 2Gi
    requests:
      cpu: 500m
      memory: 1Gi
  concurrency: 2
  queues:
    - screening
    - notifications
    - analytics

# ─── Celery Beat ──────────────────────────────────────────────────────────────
beat:
  enabled: true
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

# ─── Frontend ─────────────────────────────────────────────────────────────────
frontend:
  enabled: true
  replicaCount: 2
  image:
    repository: ghcr.io/vedanth-js/ai-ats-frontend
    tag: latest
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
  service:
    type: ClusterIP
    port: 80
  ingress:
    enabled: true
    hosts:
      - host: ai-ats.com
        paths:
          - path: /
            pathType: Prefix

# ─── Monitoring ───────────────────────────────────────────────────────────────
monitoring:
  prometheus:
    enabled: true
    serviceMonitor:
      enabled: true
      interval: 30s
  flower:
    enabled: true
    service:
      port: 5555
