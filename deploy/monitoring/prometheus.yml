# ──────────────────────────────────────────────────────────────────────────────
# Prometheus Configuration — AI ATS Enterprise Monitoring
# ──────────────────────────────────────────────────────────────────────────────

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: ai-ats-production
    environment: production

rule_files:
  - "alerts.yml"

scrape_configs:
  # ─── API Service ───────────────────────────────────────────────────────────
  - job_name: ai-ats-api
    metrics_path: /metrics
    scrape_interval: 10s
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: api
          component: fastapi

  # ─── Celery Worker ─────────────────────────────────────────────────────────
  - job_name: ai-ats-worker
    static_configs:
      - targets: ["worker:5555"]  # celery-prometheus-exporter sidecar
        labels:
          service: worker
          component: celery

  # ─── Nginx ─────────────────────────────────────────────────────────────────
  - job_name: ai-ats-nginx
    metrics_path: /metrics
    scrape_interval: 30s
    static_configs:
      - targets: ["nginx-exporter:9113"]
        labels:
          service: nginx
          component: proxy

  # ─── PostgreSQL ────────────────────────────────────────────────────────────
  - job_name: ai-ats-postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels:
          service: postgresql
          component: database

  # ─── Redis ─────────────────────────────────────────────────────────────────
  - job_name: ai-ats-redis
    static_configs:
      - targets: ["redis-exporter:9121"]
        labels:
          service: redis
          component: cache

  # ─── Node Exporter (Host Metrics) ─────────────────────────────────────────
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          component: host
