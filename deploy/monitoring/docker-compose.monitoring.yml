# ──────────────────────────────────────────────────────────────────────────────
# AI ATS — Monitoring Stack (Grafana + Prometheus + Loki + Exporters)
# Run: docker compose -f docker-compose.yml -f deploy/monitoring/docker-compose.monitoring.yml up -d
# ──────────────────────────────────────────────────────────────────────────────

services:
  # ─── Prometheus ──────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    restart: always
    networks:
      - ats_network

  # ─── Grafana ─────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/monitoring/grafana-dashboard.json:/etc/grafana/provisioning/dashboards/ai-ats.json:ro
    restart: always
    networks:
      - ats_network
    depends_on:
      - prometheus
      - loki

  # ─── Loki (Log Aggregation) ──────────────────────────────────────────────
  loki:
    image: grafana/loki:latest
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - ./deploy/monitoring/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/tmp/loki
    restart: always
    networks:
      - ats_network

  # ─── Promtail (Log Shipper) ──────────────────────────────────────────────
  promtail:
    image: grafana/promtail:latest
    command: -config.file=/etc/promtail/promtail.yml
    volumes:
      - ./deploy/monitoring/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/log:/var/log:ro
    restart: always
    networks:
      - ats_network

  # ─── Node Exporter (Host Metrics) ────────────────────────────────────────
  node-exporter:
    image: prom/node-exporter:latest
    ports:
      - "9100:9100"
    command:
      - '--path.rootfs=/host'
    pid: host
    volumes:
      - /:/host:ro,rslave
    restart: always
    networks:
      - ats_network

  # ─── PostgreSQL Exporter ─────────────────────────────────────────────────
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    ports:
      - "9187:9187"
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-pass}@db:5432/${POSTGRES_DB:-resume_db}?sslmode=disable"
    restart: always
    networks:
      - ats_network
    depends_on:
      - db

  # ─── Redis Exporter ─────────────────────────────────────────────────────
  redis-exporter:
    image: oliver006/redis_exporter:latest
    ports:
      - "9121:9121"
    command:
      - '--redis.addr=redis://redis:6379'
    restart: always
    networks:
      - ats_network
    depends_on:
      - redis

  # ─── Alertmanager ────────────────────────────────────────────────────────
  alertmanager:
    image: prom/alertmanager:latest
    ports:
      - "9093:9093"
    volumes:
      - ./deploy/monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    restart: always
    networks:
      - ats_network

volumes:
  prometheus_data:
  grafana_data:
  loki_data:

networks:
  ats_network:
    external: true
