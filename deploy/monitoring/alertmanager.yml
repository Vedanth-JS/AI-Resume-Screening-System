# ─── Alertmanager Configuration — AI ATS Alert Routing ─────────────────────

global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'default'

  routes:
    - match:
        severity: critical
      receiver: 'critical-alerts'
      continue: true
    - match:
        severity: warning
      receiver: 'warning-alerts'

receivers:
  - name: 'default'
    webhook_configs:
      - url: 'http://ai-ats-api:8000/api/notifications/alert'
        send_resolved: true

  - name: 'critical-alerts'
    webhook_configs:
      - url: '${SLACK_WEBHOOK_URL}'
        send_resolved: true
        title: '🚨 [{{ .Status | toUpper }}] {{ .GroupLabels.alertname }}'
        text: |
          *Severity:* {{ .CommonLabels.severity }}
          *Alert:* {{ .CommonAnnotations.summary }}
          *Description:* {{ .CommonAnnotations.description }}
          *Started:* {{ .StartsAt }}

  - name: 'warning-alerts'
    webhook_configs:
      - url: '${SLACK_WEBHOOK_URL}'
        send_resolved: true
